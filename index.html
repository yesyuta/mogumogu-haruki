<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mogu Mogu Haruki</title>
<meta name="theme-color" content="#F2F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="もぐもぐはるき">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#1F2B24; --muted:#66756C; --line:#D9E1DA;
  --leaf:#2E7A57; --leaf-soft:#DCEEE3; --iron:#B5542F; --iron-soft:#F6E2D8; --sleep:#3D4E8C; --sleep-soft:#E3E7F5;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",-apple-system,system-ui,sans-serif;
  --body:"Noto Sans JP","Hiragino Sans",-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141A16; --surface:#1C241F; --ink:#E6EEE8; --muted:#93A399; --line:#2C3832;
  --leaf:#6FC79A; --leaf-soft:#22392C; --iron:#E59572; --iron-soft:#3A2820; --sleep:#6E80C9; --sleep-soft:#262D47; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{touch-action:manipulation}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:23px;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:16px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.lang button{font:inherit;font-size:13px;font-weight:700;border:0;background:none;color:var(--muted);padding:0 12px;min-height:36px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:0;font-family:inherit;padding:0;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on .dot{background:var(--leaf)}

.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-block:6px 8px;margin-block:-6px 0}
.datebar{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.datebar button{background:none;border:0;color:var(--ink);font:inherit;font-size:22px;min-width:44px;height:44px;border-radius:10px;cursor:pointer}
.datebar button:active{background:var(--leaf-soft)}
.datebar .d{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:17px;min-width:0}
.datebar .d small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.today-btn{font-size:13px!important;padding:0 10px;color:var(--leaf)!important;font-weight:700!important}
.meals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.meal{font:inherit;font-weight:700;font-size:14px;min-height:52px;padding:6px 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.meal span{font-weight:400;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.meal[aria-pressed="true"] span{color:var(--bg);opacity:.85}
.who{font-size:12px;color:var(--muted);margin:0}
.today-sum{font-size:14px;color:var(--muted);margin:0}
.today-sum b{color:var(--ink)}

.group{display:flex;flex-direction:column;gap:8px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.group-h small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;display:inline-flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px;text-align:left}
.chip .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none}
.chip .box svg{width:13px;height:13px;opacity:0}
.chip.on{background:var(--leaf-soft);border-color:var(--leaf)}
.chip.on .box{background:var(--leaf);border-color:var(--leaf)}
.chip.on .box svg{opacity:1}
.chip .fe{font-size:10px;font-weight:700;font-style:normal;color:var(--iron);background:var(--iron-soft);border-radius:4px;padding:0 4px;line-height:16px}
.chip .x{display:none;font-style:normal;color:var(--muted);font-size:14px;margin-left:2px}
.editing .chip.custom{border-style:dashed}
.editing .chip.custom .x{display:inline}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}

.add{display:flex;gap:8px;flex-wrap:wrap}
.field,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px}
.add .field{flex:1 1 160px;min-width:0}
.btn{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;padding:0 16px;min-height:44px;background:var(--leaf);color:var(--bg);cursor:pointer}
.btn.ghost{background:none;color:var(--muted);font-weight:500;padding:0 4px;min-height:36px;font-size:13px}
textarea{width:100%;min-height:72px;resize:vertical}
hr{border:0;border-top:1px dashed var(--line);margin:2px 0}

.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:100px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;cursor:pointer;background:none;border:0;font:inherit;color:var(--ink);padding:0}
.bar i{display:block;width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--leaf);min-height:3px}
.bar.empty i{background:var(--line)}
.bar b{font-size:11px;font-variant-numeric:tabular-nums}
.bar span{font-size:11px;color:var(--muted)}
.bar.sel span{color:var(--leaf);font-weight:700}
.legend{font-size:12px;color:var(--muted)}
.miss{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.fe{color:var(--iron);border-color:var(--iron-soft);background:var(--iron-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px);z-index:20}

/* login */
.login{max-width:380px;margin:8vh auto 0;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.login .field{width:100%}
.login p{margin:0;color:var(--muted);font-size:13px}
.err{color:var(--iron)!important}
.foot{display:flex;justify-content:center}
.stack{display:flex;flex-direction:column;gap:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:9px;min-height:40px;background:none;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--leaf);color:var(--bg)}
.rhead{display:flex;flex-direction:column;gap:8px}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:14px;font-weight:700;border:0;background:none;color:var(--muted);padding:0 18px;min-height:38px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile.milk b{color:var(--leaf)}
.milkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
.milkgrid input[type=time]{width:100%;padding:6px 4px;min-height:40px;font-size:16px;text-align:center;color:var(--ink)}
.milkgrid input[type=time]:not(.set){color:var(--muted)}
.milkgrid .cell{display:flex;flex-direction:column;gap:4px;min-width:0}
.milkgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.milkgrid select{width:100%;padding:8px 4px;text-align:center;text-align-last:center;font-variant-numeric:tabular-nums}
.milkgrid select.set{border-color:var(--leaf);background:var(--leaf-soft);font-weight:700}
#milkTotal b{color:var(--ink);font-size:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile b small{font-size:13px;font-weight:700;color:var(--muted)}
.tile span{font-size:12px;color:var(--muted);line-height:1.35}
.tile.fe b{color:var(--iron)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(0,7.5em) 1fr auto;align-items:center;gap:10px;font-size:14px}
.rrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .track{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.rrow .track i{display:block;height:100%;background:var(--leaf);border-radius:5px}
.rrow.fe .track i{background:var(--iron)}
.rrow .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.note-row{display:grid;grid-template-columns:4.2em 1fr;gap:8px;font-size:14px}
.note-row b{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.note-row span{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.newtag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--leaf-soft);color:var(--leaf)}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.ractions .btn{flex:1 1 140px}
.sec{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.sec button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:9px;min-height:40px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.sec button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.sec .live{width:7px;height:7px;border-radius:50%;background:var(--sleep);display:inline-block}
.status{font-size:13px;color:var(--muted);margin:0;font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}
.sleepnow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.sleepnow.on{background:var(--sleep);border-color:var(--sleep);color:#fff}
.sleepnow div{display:flex;flex-direction:column;gap:2px;min-width:0}
.sleepnow b{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sleepnow span{font-size:13px;opacity:.8}
.btn.big{min-height:56px;font-size:18px;padding:0 26px;border-radius:14px;background:var(--sleep);color:#fff}
.sleepnow.on .btn.big{background:#fff;color:var(--sleep)}
.timeline{position:relative;height:30px;border-radius:8px;background:var(--bg);overflow:hidden;margin-bottom:18px}
.timeline .blk{position:absolute;top:0;bottom:0;background:var(--sleep);opacity:.85}
.timeline .blk.nap{opacity:.55}
.timeline .ml{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--leaf);border:2px solid var(--surface)}
.timeline .now{position:absolute;top:0;bottom:0;width:2px;background:var(--iron)}
.timeline .tk{position:absolute;bottom:-17px;font-size:10px;color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.timeline .tk:first-of-type{transform:none}
.timeline .grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.ticks{position:relative;height:14px;margin:-16px 0 10px}
.ticks span{position:absolute;font-size:10px;color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.sleeplist{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr) auto;grid-template-areas:'b s a e x' '. d d d .';align-items:center;gap:2px 6px}
.srow .badge{grid-area:b}.srow [data-ss]{grid-area:s}.srow .arrow{grid-area:a}.srow [data-se]{grid-area:e}.srow .xbtn{grid-area:x}.srow .dur{grid-area:d;text-align:left!important}
input[type=time]::-webkit-calendar-picker-indicator{display:none}
.srow input[type=time]{width:100%;min-height:40px;padding:6px 4px;font-size:16px;text-align:center}
.srow .arrow{color:var(--muted)}
.srow .dur{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.6em;text-align:right}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.badge.night{background:var(--sleep);color:#fff}
.badge.nap{background:var(--sleep-soft);color:var(--sleep)}
.xbtn{font:inherit;font-size:13px;border:0;background:none;color:var(--muted);min-width:36px;min-height:36px;cursor:pointer;border-radius:8px}
.xbtn.confirm{color:#fff;background:var(--iron);padding:0 8px}
.tile.sleep b{color:var(--sleep)}
.updbar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--iron-soft);color:var(--iron);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.updbar .btn{background:var(--iron);color:#fff;min-height:38px}
.age{font-variant-numeric:tabular-nums}
.age b{color:var(--ink);font-weight:700}
.tip{background:var(--leaf-soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tip-h{display:grid;grid-template-columns:1fr auto;grid-template-areas:'k c' 't c';gap:2px 10px;text-align:left;background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer}
.tip-k{grid-area:k;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--leaf)}
.tip-h b{grid-area:t;font-family:var(--display);font-size:16px;font-weight:800;text-wrap:pretty;word-break:auto-phrase}
.tip-c{grid-area:c;align-self:center;font-style:normal;color:var(--leaf);transition:transform .2s}
.tip-h[aria-expanded="false"] .tip-c{transform:rotate(-90deg)}
#tipText{margin:0;font-size:14px;line-height:1.65}
.tip-src{margin:2px 0 0;font-size:11px;color:var(--muted)}
.btn.wa{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:#1F8A4C;color:#fff}
.btn.wa svg{width:20px;height:20px;flex:none}
.btn.line{background:none;color:var(--leaf);border:1.5px solid var(--leaf)}
.empty-r{color:var(--muted);font-size:14px;margin:0}
@media print{
  body{background:#fff;color:#000;padding:0}
  header .hright,.tabs,.seg,#rPrev,#rNext,.ractions,.foot,.toast,#logView,.rcard:has(#rExport){display:none!important}
  .datebar,.tile,.rcard{border-color:#ccc;background:#fff}
  .rcard{break-inside:avoid}
}
@media (prefers-reduced-motion:no-preference){.chip,.meal,.bar i{transition:background .15s,border-color .15s,height .2s}}
</style>
</head>
<body>

<form class="login" id="loginView" hidden>
  <h1 id="lTitle"></h1>
  <p id="lHelp"></p>
  <input class="field" id="dname" type="text" maxlength="20" autocomplete="nickname" hidden>
  <input class="field" id="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" required>
  <input class="field" id="password" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit" id="lBtn"></button>
  <p class="err" id="lErr" hidden></p>
  <button class="btn ghost" type="button" id="lSwitch"></button>
</form>

<div class="login" id="verifyView" hidden>
  <h1 id="vTitle"></h1>
  <p id="vHelp"></p>
  <button class="btn" type="button" id="vCheck"></button>
  <button class="btn line" type="button" id="vResend"></button>
  <p class="err" id="vErr" hidden></p>
  <button class="btn ghost" type="button" id="vLogout"></button>
</div>

<div class="wrap" id="appView" hidden>
  <div class="updbar" id="updBar" hidden><span></span><button class="btn" id="updBtn" type="button"></button></div>
  <header>
    <div>
      <h1 id="title"></h1>
      <p class="sub age" id="subtitle"></p>
    </div>
    <div class="hright">
      <div class="lang" role="group" aria-label="Language"><button data-l="ja">日本語</button><button data-l="en">EN</button><button data-l="zh">中文</button></div>
      <div class="sync" id="sync"><i class="dot"></i><span></span></div>
    </div>
  </header>

  <form class="rcard" id="nameCard" hidden>
    <h2 id="nmTitle"></h2>
    <div class="add"><input class="field" id="nmInput" maxlength="20" autocomplete="nickname"><button class="btn" type="submit" id="nmSave"></button></div>
  </form>

  <section class="tip" id="tipCard" hidden>
    <button class="tip-h" id="tipToggle" type="button" aria-expanded="true"><span class="tip-k" id="tipKicker"></span><b id="tipTitle"></b><i class="tip-c" aria-hidden="true">▾</i></button>
    <div id="tipBody"><p id="tipText"></p><p class="tip-src" id="tipSrc"></p></div>
  </section>
  <form class="rcard" id="birthCard" hidden>
    <h2 id="bTitle"></h2>
    <div class="add"><input class="field" type="date" id="bInput" required><button class="btn" type="submit" id="bSave"></button></div>
  </form>

  <div class="tabs" role="tablist">
    <button role="tab" data-v="log" id="tabLog"></button>
    <button role="tab" data-v="report" id="tabReport"></button>
  </div>

  <div id="logView" class="stack">
  <div class="bar-top">
    <div class="datebar">
      <button id="prev" aria-label="Previous day">‹</button>
      <div class="d" id="dlabel"></div>
      <button class="today-btn" id="todayBtn"></button>
      <button id="next" aria-label="Next day">›</button>
    </div>
    <div class="sec" id="secTabs" role="tablist"><button data-s="food"></button><button data-s="milk"></button><button data-s="sleep"></button></div>
    <div class="meals" id="meals" role="group"></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:2px">
    <p class="status" id="status"></p>
    <p class="who" id="who"></p>
  </div>

  <div id="secMilk" class="stack" hidden>
  <section class="rcard milk">
    <div class="group-h"><h2 id="tMilk"></h2><small id="milkTotal"></small></div>
    <div class="milkgrid" id="milkGrid"></div>
  </section>
  </div>

  <div id="secSleep" class="stack" hidden>
    <section class="sleepnow" id="sleepNow">
      <div><b id="snMain"></b><span id="snSub"></span></div>
      <button class="btn big" id="snBtn"></button>
    </section>
    <section class="rcard">
      <div class="timeline" id="timeline" aria-hidden="true"></div>
      <div class="group-h"><h2 id="tSleepList"></h2><small id="sleepTotal"></small></div>
      <div class="sleeplist" id="sleepList"></div>
      <button class="btn line" id="sleepAdd"></button>

// absolute minutes since epoch-day for a sleep on day k
const dayStart=k=>parse(k).getTime()/60000;
function absSleep(k,x){const st=dayStart(k)+toMin(x.s);return{st,en:x.e?st+durMin(x.s,x.e):null}}
function nowMin(){return Date.now()/60000}
function shiftKey(k,n){const d=parse(k);d.setDate(d.getDate()+n);return key(d)}
function ongoingSleep(){const tk=key(new Date());for(const k of [tk,shiftKey(tk,-1)]){const sl=getDay(k).sleeps;for(let i=sl.length-1;i>=0;i--)if(!sl[i].e)return{k,i,x:sl[i]}}return null}
function lastWakeAbs(){const tk=key(new Date());let best=null;for(const k of [tk,shiftKey(tk,-1)])getDay(k).sleeps.forEach(x=>{if(x.e){const a=absSleep(k,x).en;if(a<=nowMin()+1&&(best===null||a>best))best=a}});return best}
function lastMilk(){const tk=key(new Date());for(const k of [tk,shiftKey(tk,-1)]){const d=getDay(k);let best=null;d.milk.forEach((ml,i)=>{if(ml&&d.milkT[i]){const a=dayStart(k)+toMin(d.milkT[i]);if(a<=nowMin()+1&&(best===null||a>best))best=a}});if(best!==null)return best}return null}
function sleepTotals(k){const sl=getDay(k).sleeps;let naps=0,napM=0,nightM=0;sl.forEach(x=>{const dm=durMin(x.s,x.e);if(isNight(x.s)){if(dm)nightM+=dm}else{naps++;if(dm)napM+=dm}});return{naps,napM,nightM,count:sl.length}}
const fmtDur=m=>L().hm(Math.max(0,Math.round(m)));
function sleepTap(){

  if(o){const d=getDay(o.k);d.sleeps[o.i].e=nowHM();days[o.k]=d;saveDay(o.k)}
  else{const d=getDay(tk);d.sleeps.push({s:nowHM(),e:null});d.sleeps=normSleeps(d.sleeps);days[tk]=d;saveDay(tk)}

}

  if(o)parts.push(t.stSleeping(fmtDur(n-absSleep(o.k,o.x).st)));else if(lw!==null)parts.push(t.stAwake(fmtDur(n-lw)));

function renderSleep(){

    $('#sleepNow').classList.toggle('on',!!o);

    else{$('#snMain').textContent=lw!==null?t.awake(fmtDur(n-lw)):t.noSleep;$('#snSub').textContent='';$('#snBtn').textContent=t.sleepBtn}}
  // timeline 0-24 for this date (includes the previous night's tail)

      unsubs.forEach(f=>f());unsubs=[];me=u;
      if(!u){mode='login';show('login');return}
      if(!u.emailVerified){mode='login';show('verify');return}
      startData(u);
    });
  }catch(e){mode='local';show('app');toast(L().saveErr)}
}

$('#updBtn').onclick=()=>location.reload();
if('serviceWorker' in navigator){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloading)return;reloading=true;
    const busy=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(busy){$('#updBar').hidden=false;$('#updBar span').textContent=L().outdated;$('#updBtn').textContent=L().reload}else location.reload()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{}));
}
</script>
